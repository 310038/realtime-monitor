name: realtime-monitor

services:
  db:
    image: mariadb:11.7
    container_name: rtm-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in .env}
      MARIADB_DATABASE: ${DB_NAME:-monitor}
      MARIADB_USER: ${DB_USER:-monitor}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set in .env}
      TZ: ${TZ:-Asia/Taipei}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_EXPOSE_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend-net]

  backend:
    build:
      context: ./backend
      target: runtime
    image: realtime-monitor-backend:latest
    container_name: rtm-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      SAMPLE_DATA_PATH: /app/sample_data/records.csv
      TZ: ${TZ:-Asia/Taipei}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
      - ./sample_data:/app/sample_data:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks: [backend-net, frontend-net]

  frontend:
    build:
      context: ./frontend
      target: runtime
    image: realtime-monitor-frontend:latest
    container_name: rtm-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      TZ: ${TZ:-Asia/Taipei}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    networks: [frontend-net]

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge

volumes:
  db_data:
  backend_logs:
